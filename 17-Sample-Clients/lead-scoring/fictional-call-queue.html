<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Call Queue (sample)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
/* VOICE   calm, fast, work tool: a sales floor's call sheet, one call in hand at a time
   IDEA    the printed call sheet: the "Now calling" card is the sheet, up-next is the stack behind it
   PICTURE the Now card itself: name, local time, one big Call button, outcome chips
   COLOUR+TYPE Reale brand: Warm Canvas / Midnight Ink grounds, Electric Cobalt for action, Signal Mint only on progress; Inter
   LAYOUT  one 680px column, thumb-reach bottom tabs, full-screen detail sheet on phones */
:root{color-scheme:light dark;
  --bg:light-dark(#F7F4EE,#081020);--card:light-dark(#FFFFFF,#111B33);--ink:light-dark(#081020,#F7F4EE);
  --muted:light-dark(#334155,#A9B4C8);--line:light-dark(rgba(8,16,32,.12),rgba(247,244,238,.14));
  --acc:light-dark(#4F5DFF,#7C87FF);--acc-ink:light-dark(#FFFFFF,#081020);--soft:light-dark(#EEF0FF,#1B2547);--mint:#2DD4BF;
  --r:14px;font-synthesis:none}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
#app{max-width:680px;margin:0 auto;padding:0 12px 96px}
h1{font-size:22px;line-height:1.1;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(22px,6vw,30px);line-height:1.1;margin:6px 0 4px;text-wrap:balance;letter-spacing:-.015em}
h3{font-size:16px;margin:0}
p{margin:6px 0}
small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
q{quotes:"“" "”"}
.fict{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:14px;font-weight:600}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row.gap{justify-content:flex-start;flex-wrap:wrap}.wrap{flex-wrap:wrap}
.sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.mode{font-weight:600}.mode-memory{color:var(--ink);text-decoration:underline}
.goal{text-align:right;white-space:nowrap}.goal b{font-size:26px}.goal span{color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:9px;background:var(--line);margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);transition:width .4s}
.stats{gap:6px 14px;font-size:13px;color:var(--muted)}.stats b{color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.chips.scroll>*{flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.now{border:2px solid var(--acc);box-shadow:0 10px 30px -18px var(--acc)}
.empty{text-align:center;padding:32px 16px}
.lbl{margin:16px 0 6px;font-size:14px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;white-space:nowrap;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;flex:none}
.b1{background:var(--acc);color:var(--acc-ink)}.b2{border:1.5px solid var(--acc);color:var(--acc)}.b3{border:1.5px solid var(--line);color:var(--muted)}
.why{font-size:13px;color:var(--muted);text-align:right}
.meta{color:var(--muted);font-size:14px}
.clk{white-space:nowrap;font-size:13px;font-weight:600}.clk.open{color:var(--ink)}.clk.early,.clk.late,.clk.weekend{color:var(--muted);text-decoration:line-through dotted}
.meta .clk.open::before{content:"● ";color:var(--mint)}
.btn{appearance:none;font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.big{font-size:17px;min-height:56px}
.btn:focus-visible,.chip:focus-visible,.out:focus-visible,.lrow:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.link{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--acc);text-decoration:underline;cursor:pointer;min-height:auto}
.call{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:12px 0}.nw{white-space:nowrap}
.angle{margin:8px 0;padding-left:18px}.angle li{margin:4px 0}
.next{font-weight:600;margin:10px 0}
.note{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:12px}
.warn{background:var(--soft);border-left:4px solid var(--acc);border-radius:8px;padding:8px 10px;font-size:14px}
.outs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.out{appearance:none;font:inherit;font-weight:600;font-size:15px;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:8px}
.out-audit_booked,.out-interested,.out-callback{border-color:var(--acc);color:var(--acc)}
.out-do_not_call{border-style:dashed}
.out:active,.btn:active,.chip:active{transform:translateY(1px)}
.chip{appearance:none;font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pend{margin-top:8px;padding:12px;border-radius:12px;background:var(--soft)}
.q{font-weight:600;margin:8px 0 0}
.fld{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:10px 0}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.grow{flex:1}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.list{list-style:none;margin:0;padding:0}
.lrow{appearance:none;width:100%;display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;min-height:56px;cursor:pointer}
.list li:first-child .lrow{border-top:0}
.nm{flex:1;font-weight:600}.pts{font-weight:700;color:var(--muted)}
.prk{display:flex;align-items:center;gap:8px}.prk .lrow{flex:1}
.script{margin-top:10px}.scard{background:var(--bg);border-radius:12px;padding:12px;margin:8px 0}
.scard p{margin:8px 0}.subj{font-weight:600}
.gear{display:block;font-size:12px;font-weight:700;color:var(--acc);margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.tile{background:var(--bg);border-radius:10px;padding:8px}.tile span{font-size:12px;color:var(--muted);display:block}.tile b{font-size:20px;display:block;line-height:1.2}.tile small{font-size:12px}
.why-list{padding-left:18px}.why-list li{margin:6px 0}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.tl li span{color:var(--muted);white-space:nowrap;font-size:13px}
.x{margin-left:auto;appearance:none;border:0;background:none;color:var(--muted);font-size:20px;min-width:36px;min-height:36px;cursor:pointer}
.cal{list-style:none;padding:0;margin:0}.day{padding:8px 0;border-top:1px solid var(--line)}.day ul{margin:4px 0 0;padding-left:16px}.day li{margin:2px 0}
.links a{color:var(--acc)}
.muted{color:var(--muted)}.pad{padding:8px 4px}.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;white-space:normal}
.scroll{overflow-x:auto}
details{margin-top:12px}summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom))}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);min-height:48px;border-radius:10px;cursor:pointer;padding:4px}
.tabs button.on{color:var(--acc);background:var(--soft)}
#sheet .scrim{position:fixed;inset:0;background:rgba(8,16,32,.45);z-index:7}
#sheet .panel{position:fixed;z-index:8;inset:0;overflow-y:auto;background:var(--card);padding:16px 16px 40px;outline:none}
@media(min-width:760px){#sheet .panel{left:auto;width:560px;border-left:1px solid var(--line)}}
#toast{position:fixed;left:12px;right:12px;bottom:76px;z-index:9;display:flex;justify-content:center;pointer-events:none}
.tst{pointer-events:auto;max-width:640px;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);font-size:14px}
.tst span{flex:1}.tst .btn{background:transparent;color:var(--bg);border-color:var(--bg)}.tst textarea{width:100%;font:inherit;font-size:13px}
.boot{padding:40px 0;text-align:center;color:var(--muted)}
@media(max-width:380px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
